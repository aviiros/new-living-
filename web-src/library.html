<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><title>Living Ideas</title><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
@font-face{font-family:Amiri;src:url(fonts/Amiri-Regular.ttf);font-weight:400}@font-face{font-family:Amiri;src:url(fonts/Amiri-Bold.ttf);font-weight:700}
@font-face{font-family:"EB Garamond";src:url(fonts/EBGaramond12-Regular.otf);font-weight:400}@font-face{font-family:"EB Garamond";src:url(fonts/EBGaramond12-Bold.otf);font-weight:700}
:root{--bg:#f0e8d3;--bg2:#e9dfc6;--side:#e8dec5;--card:#fbf7ec;--text:#14262e;--mute:#6b6a58;--line:#d9cdb0;--acc:#c3714c;--acc2:#918e61;--gold:#b8975a;--sel:rgba(195,113,76,.14);--shadow:0 2px 6px rgba(20,38,46,.2),0 10px 24px rgba(20,38,46,.16);--ser:Amiri,"EB Garamond",Georgia,serif}
:root[data-t=dark]{--bg:#121e24;--bg2:#1a2a32;--side:#0f1a1f;--card:#1a2a32;--text:#f0e8d3;--mute:#a8a58f;--line:#2c3f48;--acc:#d9825c;--acc2:#a5a36f;--gold:#cdb27a;--sel:rgba(217,130,92,.2);--shadow:0 2px 6px rgba(0,0,0,.5),0 10px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}input,select,textarea{font:inherit;color:var(--text)}svg{flex:none}
#app{display:flex;height:100%}
aside{width:252px;flex:none;background:var(--side);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px 10px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px}.brand img{width:46px;height:46px;border-radius:10px;object-fit:cover;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.brand b{display:block;font:700 15px/1 "EB Garamond",serif;letter-spacing:.16em}.brand small{font:12px var(--ser);color:var(--mute);letter-spacing:.04em}
.search{position:relative;margin:0 4px 12px}.search input{width:100%;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);padding:0 32px 0 10px;outline:none}.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--sel)}.search svg{position:absolute;right:9px;top:8px;width:16px;height:16px;color:var(--mute)}
.nav{display:flex;flex-direction:column;gap:2px}.sec{font:700 12px var(--ser);color:var(--mute);margin:16px 10px 6px;display:flex;align-items:center;justify-content:space-between;letter-spacing:.04em}
.item{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:start;padding:7px 10px;border-radius:9px;font-size:14px;width:100%}.item:hover{background:var(--sel)}.item.on{background:var(--acc);color:#fff;font-weight:600}.item svg{width:18px;height:18px}.item .n{margin-inline-start:auto;font-size:12px;opacity:.7}
.mini{border:0;background:none;color:var(--acc);font-size:18px;line-height:1;padding:0 4px}.foot{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line)}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header.top{display:flex;align-items:center;gap:12px;padding:20px 32px 10px}header.top h1{font:700 32px var(--ser);margin:0;flex:1}
.tool{display:flex;align-items:center;gap:8px}.tool select,.seg button,.btn{height:32px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:0 11px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}.btn.danger{background:#b3402a;border-color:#b3402a;color:#fff}.seg{display:flex}.seg button{border-radius:0;width:36px;padding:0;display:grid;place-items:center}.seg button:first-child{border-radius:0 9px 9px 0}.seg button:last-child{border-radius:9px 0 0 9px}.seg button.on{background:var(--sel);color:var(--acc)}.seg svg{width:16px;height:16px}input[type=range]{width:90px;accent-color:var(--acc)}
#scroller{flex:1;overflow:auto;overflow-x:hidden;padding:6px 32px 44px}
#grid,.hrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--w,170px),1fr));gap:30px 26px;align-items:start}
.tile{display:flex;flex-direction:column;gap:9px;cursor:pointer;min-width:0;border-radius:6px;outline:none}.tile.drag{opacity:.4}.tile.over .cv{outline:3px dashed var(--acc)}
.cv{position:relative;aspect-ratio:2/3;border-radius:4px;overflow:hidden;box-shadow:var(--shadow);background:#444;transition:transform .15s}.tile:hover .cv,.tile:focus-visible .cv{transform:translateY(-3px)}.tile:focus-visible .cv{outline:3px solid var(--acc)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;top:6px;inset-inline-start:6px;background:rgba(20,38,46,.78);color:#f0e8d3;font-size:10px;border-radius:5px;padding:1px 6px}
.gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:14% 10%;color:#f4ead2;text-align:center}.gen:before{content:"";position:absolute;inset:6%;border:1px solid rgba(214,181,110,.6);border-radius:2px}
.gen b{font:700 var(--gs,1.1em)/1.4 var(--ser);margin-top:auto}.gen small{opacity:.85;margin-top:auto;font-size:.78em;padding-top:10px}.shade{position:absolute;inset:0;background:linear-gradient(to left,rgba(0,0,0,.2),transparent 12%,transparent 88%,rgba(255,255,255,.12));pointer-events:none}
.meta{display:flex;flex-direction:column;gap:2px;padding:0 2px}.t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.a{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin-top:2px}.pill{background:var(--sel);color:var(--acc);border-radius:99px;padding:0 8px;font-weight:600;font-size:11px}.star{color:var(--gold)}
.dots{margin-inline-start:auto;border:0;background:none;font-size:18px;line-height:1;color:var(--mute);border-radius:6px;padding:0 6px;opacity:0}.tile:hover .dots,.dots:focus{opacity:1}.dots:hover{background:var(--sel)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:2px}.bar i{display:block;height:100%;background:var(--acc)}
#list{display:none;flex-direction:column}.lrow{display:flex;align-items:center;gap:14px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}.lrow:hover{background:var(--sel)}.lrow .cv{width:38px;flex:none;box-shadow:0 1px 4px rgba(0,0,0,.3)}.lrow .gen{padding:8%}.lrow .gen b{font-size:6px}.lrow .gen small,.lrow .gen:before,.lrow .badge{display:none}.lrow .tt{flex:1;min-width:0}.lrow .pr{width:130px}.lrow .dt{width:100px;color:var(--mute);font-size:12px}
.empty{display:none;text-align:center;margin:10vh auto 0;max-width:440px;color:var(--mute)}.empty img{width:150px;opacity:.95;border-radius:18px}.empty h2{color:var(--text);font:700 24px var(--ser)}
.home{display:none;flex-direction:column;gap:26px;min-width:0}.cards>*{min-width:0}.card,.hero h2,.gst{overflow-wrap:anywhere}#langBtn{display:none}.cards{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.5fr);gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.card h3{margin:0 0 10px;font:700 17px var(--ser)}
.goal{display:flex;align-items:center;gap:16px}.ring{position:relative;width:96px;height:96px;flex:none}.ring svg{width:96px;height:96px;transform:rotate(-90deg)}.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:700 22px var(--ser);line-height:1.1}.ring .c small{display:block;font:12px "Segoe UI";color:var(--mute);font-weight:400}
.gst{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}.gst b{color:var(--text);font-size:15px}.week{display:flex;gap:4px;margin-top:6px}.week i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:10px;font-style:normal;color:var(--mute)}.week i.d{background:var(--acc2);border-color:var(--acc2);color:#fff}.week i.t{border-color:var(--acc)}
.hero{display:flex;gap:18px;align-items:center}.hero .cv{width:104px;flex:none}.hero .info{flex:1;min-width:0}.hero h2{margin:0 0 3px;font:700 22px var(--ser)}.hero .a{margin-bottom:10px;font-size:13px}.hero .bar{height:5px;margin:8px 0}
.hsec{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}.hsec h2{font:700 21px var(--ser);margin:0}.link{border:0;background:none;color:var(--acc);font-size:13px}
.notes{display:none;flex-direction:column;gap:14px}.nbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.nbar .tabs{display:flex;gap:4px}.tab{border:1px solid var(--line);background:var(--card);border-radius:99px;height:30px;padding:0 13px;font-size:13px}.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.ng{display:flex;flex-direction:column;gap:8px}.nh{display:flex;align-items:center;gap:10px;font:700 17px var(--ser);margin-top:10px}.nh .cv{width:34px;box-shadow:0 1px 4px rgba(0,0,0,.3)}.nh .gen{padding:6%}.nh .gen b{font-size:5px}.nh .gen small,.nh .gen:before,.nh .badge{display:none}
.nt{background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--gold);border-radius:10px;padding:10px 14px;cursor:pointer}.nt:hover{border-color:var(--acc)}.nt .ty{font-size:11px;color:var(--mute);display:flex;gap:8px}.nt q{display:block;font:17px/1.7 var(--ser);quotes:"«" "»"}.nt p{margin:4px 0 0;font-size:14px;color:var(--text);background:var(--sel);border-radius:8px;padding:6px 10px}.nt .x{margin-inline-start:auto;border:0;background:none;color:var(--mute)}
#reader{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:20}#reader.on{display:flex}
#rbar{position:absolute;top:0;inset-inline:0;height:42px;z-index:5;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--side);border-bottom:1px solid var(--line);transform:translateY(-100%);transition:transform .22s}#reader.bar #rbar,#reader.fix #rbar{transform:none}#reader.fix #stage{margin-top:42px}
#rbar .rt{flex:1;text-align:center;font:700 14px var(--ser);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#rbar button{border:0;background:none;display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;font-size:13px}#rbar button:hover,#rbar button.on{background:var(--sel)}#rbar svg{width:17px;height:17px}
#back{background:var(--acc)!important;color:#fff!important;font-weight:600}#back:hover{filter:brightness(1.08)}#hot{position:absolute;top:0;inset-inline:0;height:6px;z-index:6;display:none}#reader:not(.fix) #hot{display:block}#endcard{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:7;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 20px;display:none;max-width:min(560px,92vw);text-align:center}#endcard.on{display:block}#endcard h4{margin:0 0 4px;font:700 18px var(--ser)}#endcard p{margin:0 0 12px;color:var(--mute);font-size:13px}#endcard .acts{justify-content:center;margin-top:0;flex-wrap:wrap}#stage{flex:1;display:flex;min-height:0;position:relative}.fr{flex:1;border:0;width:100%;background:#fff;min-width:0}#pframe{display:none}
#panel{width:340px;flex:none;background:var(--card);border-inline-start:1px solid var(--line);display:none;flex-direction:column}#panel.on{display:flex}#panel h3{margin:0;padding:14px 16px;font:700 17px var(--ser);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}#plist{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
#find{position:absolute;top:50px;left:14px;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;display:none;gap:6px;align-items:center}#find.on{display:flex}#find input{height:30px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg);width:200px}
#pop{position:absolute;top:48px;inset-inline-end:60px;z-index:6;width:300px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:none}#pop.on{display:block}#pop h4{margin:0 0 8px;font:700 14px var(--ser)}.fsz{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}.fsz button{width:46px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sw button{height:44px;border:2px solid var(--line);border-radius:10px;font-size:11px;font-weight:600}.sw button.on{border-color:var(--acc)}
#menu{position:fixed;z-index:80;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:5px;display:none;max-height:90vh;overflow:auto}#menu button{display:flex;width:100%;border:0;background:none;text-align:start;padding:7px 10px;border-radius:7px;font-size:13px;gap:8px;align-items:center}#menu button:hover{background:var(--acc);color:#fff}#menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}#menu .ck{width:14px}#menu .danger{color:#c4422d}
.modal{position:fixed;inset:0;background:rgba(10,20,25,.5);display:none;place-items:center;z-index:90}.modal.on{display:grid}.box{background:var(--card);border-radius:16px;padding:22px;width:min(460px,92vw);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}.box h3{margin:0 0 12px;font:700 20px var(--ser)}.box label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}.box input[type=text],.box input[type=number],.box input[type=time]{width:100%;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);padding:0 10px}.acts{display:flex;gap:8px;margin-top:16px}
.stars{display:flex;gap:2px;direction:ltr;justify-content:flex-end}.stars button{border:0;background:none;font-size:24px;color:var(--line);padding:0}.stars button.on{color:var(--gold)}.chk{display:flex;gap:8px;align-items:center;margin:8px 0}.chk input{accent-color:var(--acc)}kbd{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font:12px "Segoe UI"}.kb{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
#drop{position:fixed;inset:10px;border:3px dashed var(--acc);border-radius:18px;background:var(--sel);display:none;place-items:center;font:700 24px var(--ser);color:var(--acc);z-index:95;pointer-events:none}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#14262e;color:#f0e8d3;padding:9px 18px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;z-index:99;pointer-events:none}#toast.on{opacity:1}

.lang{display:flex;margin:0 4px 12px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}.lang button{flex:1;border:0;background:none;height:28px;font-size:12px;font-weight:600;color:var(--mute)}.lang button.on{background:var(--acc);color:#fff}
html[dir=ltr] .search svg{right:auto;left:9px}html[dir=ltr] .search input{padding:0 10px 0 32px}
html[dir=ltr] .seg button:first-child{border-radius:9px 0 0 9px}html[dir=ltr] .seg button:last-child{border-radius:0 9px 9px 0}
html[dir=ltr] #find{left:auto;right:14px}html[dir=ltr] #back svg{transform:scaleX(-1)}html[dir=ltr] .gen b,html[dir=ltr] .gen small{font-family:"EB Garamond",Georgia,serif}
html[dir=ltr] .brand small{letter-spacing:.08em}html[dir=ltr] header.top h1,html[dir=ltr] .hsec h2,html[dir=ltr] .card h3{font-family:"EB Garamond",Georgia,serif}

html[data-platform=android] #rfs,html[data-platform=android] #drop{display:none!important}
#scrim{position:fixed;inset:0;background:rgba(10,20,25,.45);z-index:55;display:none}body.drawer #scrim{display:block}
@media(max-width:760px){
 aside{position:fixed;top:0;bottom:0;inset-inline-start:0;width:84vw;max-width:320px;z-index:60;transform:translateX(105%);transition:transform .25s;box-shadow:var(--shadow);padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:calc(10px + env(safe-area-inset-bottom))}
 html[dir=ltr] aside{transform:translateX(-105%)}body.drawer aside{transform:none}
 #menuBtn{display:grid!important;place-items:center}
 header.top{padding:calc(12px + env(safe-area-inset-top)) 14px 8px;flex-wrap:wrap;gap:8px}header.top h1{font-size:24px;min-width:0}
 #tool{width:100%;overflow-x:auto;padding-bottom:2px}#size{display:none}
 #scroller{padding:4px 14px calc(90px + env(safe-area-inset-bottom))}
 #grid,.hrow{gap:20px 14px;grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
 .dots{opacity:1}.cards{grid-template-columns:minmax(0,1fr)}.hero .cv{width:84px}
 .card{padding:14px}.goal{flex-wrap:wrap;gap:12px}.week{flex-wrap:wrap}.hero{gap:12px}.hero h2{font-size:19px}.hero .a{white-space:normal;overflow:visible;text-overflow:clip}
 #langBtn{display:inline-flex!important;align-items:center;justify-content:center;height:38px;min-width:44px;padding:0 10px;font-weight:700}
 #rbar{padding-top:env(safe-area-inset-top);height:calc(44px + env(safe-area-inset-top))}#reader.fix #stage{margin-top:calc(44px + env(safe-area-inset-top))}
 #rbar button{padding:5px 8px}#panel{position:absolute;inset:0;width:100%!important;z-index:8}#pop{inset-inline:8px;width:auto}#find{left:8px;right:8px}#find input{flex:1;width:auto}
 .lrow .pr,.lrow .dt{display:none}.box{padding:16px}#endcard{bottom:calc(20px + env(safe-area-inset-bottom))}#toast{bottom:calc(24px + env(safe-area-inset-bottom))}
}
@media(max-width:980px){aside{width:208px}.cards{grid-template-columns:minmax(0,1fr)}}
</style></head>
<body>
<div id="app">
<aside>
 <div class="brand"><img src="assets/emblem.png" alt=""><div><b>LIVING IDEAS</b><small>كتاب · فكرة · حياة</small></div></div>
 <div class="lang" data-noloc="1" role="group" aria-label="Language"><button data-lang="ar">العربية</button><button data-lang="en">English</button></div>
 <div class="search"><input id="q" type="search" placeholder="بحث في المكتبة" aria-label="بحث"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></div>
 <nav class="nav" id="nav"></nav>
 <div class="sec"><span>الأنواع</span></div><nav class="nav" id="fmts"></nav>
 <div id="serWrap"><div class="sec"><span>السلاسل</span></div><nav class="nav" id="sers"></nav></div>
 <div class="sec"><span>المجموعات</span><button class="mini" id="addCol" title="مجموعة جديدة">＋</button></div><nav class="nav" id="cols"></nav>
 <div class="foot"><button class="item" id="themeBtn"></button><button class="item" id="addBtn2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>إضافة كتاب</button><button class="item" id="moreBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>المزيد</button></div>
</aside>
<main>
 <header class="top"><button class="btn" id="menuBtn" aria-label="القائمة" style="display:none;width:38px;padding:0;font-size:18px">☰</button><h1 id="title"></h1><button class="btn" id="langBtn" data-noloc="1" aria-label="Language / اللغة"></button><div class="tool" id="tool"><input type="range" id="size" min="120" max="260" step="10" title="حجم الأغلفة">
  <div class="seg"><button id="vg" title="شبكة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg></button><button id="vl" title="قائمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
  <select id="sort"><option value="recent">الأحدث قراءة</option><option value="title">العنوان</option><option value="author">المؤلف</option><option value="added">تاريخ الإضافة</option><option value="rating">التقييم</option><option value="manual">ترتيبي (بالسحب)</option></select>
  <button class="btn primary" id="addBtn">إضافة كتاب</button></div></header>
 <div id="scroller"><div class="home" id="home"></div><div class="notes" id="notes"></div><div id="grid"></div><div id="list"></div>
  <div class="empty" id="empty"><img src="assets/logo.png" alt="Living Ideas"><h2 id="et"></h2><p id="ep"></p></div></div>
</main></div>

 <div id="stage"><iframe id="frame" class="fr" title="كتاب" allow="fullscreen" sandbox="allow-scripts allow-same-origin allow-modals allow-downloads allow-popups allow-forms"></iframe><iframe id="pframe" class="fr" title="PDF"></iframe>
