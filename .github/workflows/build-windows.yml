name: Build Windows app
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install root packages (jszip is copied into the app)
        shell: bash
        run: |
          for i in 1 2 3 4; do npm install --no-audit --no-fund && exit 0; echo "retry $i"; sleep 20; done; exit 1
      - name: Prepare the app pages
        run: node scripts/prepare-www.js --desktop
      - name: Install desktop packages
        working-directory: windows
        shell: bash
        run: |
          for i in 1 2 3 4; do npm install --no-audit --no-fund && exit 0; echo "retry $i"; sleep 20; done; exit 1
      - name: Build installer and portable exe
        working-directory: windows
        shell: bash
        run: |
          for i in 1 2 3 4; do npm run dist && exit 0; echo "retry $i"; sleep 20; done; exit 1
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Living-Ideas-Windows
          path: |
            windows/dist/Living-Ideas-Setup-*.exe
            windows/dist/Living-Ideas-Portable-*.exe
      - name: Self-test (opens the real app, translates sentences with the downloaded models)
        shell: pwsh
        timeout-minutes: 20
        run: |
          $env:LI_SMOKE = '1'
          $env:LI_SMOKE_OUT = "$PWD\smoke.json"
          $p = Start-Process -FilePath "$PWD\windows\dist\win-unpacked\Living Ideas.exe" -PassThru
          if (-not $p.WaitForExit(900000)) { $p.Kill() }
          if (Test-Path smoke.json) { Get-Content smoke.json } else { Write-Host 'no report written'; exit 1 }
          if ((Get-Content smoke.json -Raw | ConvertFrom-Json).ok -ne $true) { exit 1 }
      - name: Also publish the Windows files as a release download (does not use the artifact storage quota)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-latest >/dev/null 2>&1 || gh release create windows-latest --prerelease --title "Latest Windows build" --notes "Automatic build of the newest version."
          gh release upload windows-latest windows/dist/Living-Ideas-Setup-*.exe windows/dist/Living-Ideas-Portable-*.exe --clobber
          gh release edit windows-latest --notes "Built from commit ${GITHUB_SHA::7} on $(date -u +%F) UTC"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: windows-selftest-report
          path: smoke.json
          if-no-files-found: ignore
