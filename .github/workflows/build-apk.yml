name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Prepare web assets and sync Android project
        run: node scripts/prepare-www.js && npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          for i in 1 2 3 4; do ./gradlew assembleDebug --no-daemon && exit 0; echo "retry $i"; sleep 20; done; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: Living-Ideas-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Build signed release APK (only if the KEYSTORE_BASE64 secret exists)
        if: env.KS != ''
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > app/release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KS_ALIAS" "$KEY_PASS" > key.properties
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: env.KS != ''
        with:
          name: Living-Ideas-release-apk
          path: android/app/build/outputs/apk/release/*.apk
